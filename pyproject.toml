[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webscraper-for-news"
version = "0.1.0"
description = "News digest scraper with AI summarization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.0",
  "PySocks>=1.7.1",
  "beautifulsoup4>=4.12.0",
  "feedparser>=6.0.11",
  "openai>=1.40.0",
  "jinja2>=3.1.4",
  "python-dotenv>=1.0.1",
  "flask>=3.0.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
